
{% load static %}

<link rel="stylesheet" href="{% static 'css/login.css' %}">

<main class="container">
    <div class="row">

        <div class="container container-login">
            <div class="info">
                <h1>Sistema Enfermería Inacap</h1><span>Made with<i class="fa fa-heart"></i>
                        by Jhon Doe</span>
            </div>
        
            <footer class="main-footer">
                <div class="float-right d-none d-sm-block">
                </div>
            </footer>
        
        </div>
        
        {% if error %}
        <div class="box-alert" id="box-alert">
            {{ error }}
            <button  data-dismiss="alert" aria-label="Close" onclick="cerrarAlerta()">
                <span aria-hidden="true">×</span>
            </button>
        </div>
        {% endif %}
        

        <div class="form">
            <div class="thumbnail"><img src="{% static 'img/login-icon.svg' %}" alt="Enfermeria" /></div>
        
            <form class="login-form" method="POST">
                
                {% csrf_token %}
                <input type="text" name="username" placeholder="Usuario" />
                <input type="password" name="password" placeholder="Contraseña" />
                <!-- <button>login</button> -->
                <div class="">
                    <button>Login</button>
                </div>
            </form>
        </div>

    </div>
</main>

<script>

function cerrarAlerta(){
    var alert =  document.getElementById('box-alert');
    alert.style.display = "none";
}

</script>
